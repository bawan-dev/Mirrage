<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-labelledby="title desc">
  <title id="title">Mirrage physical and software architecture</title>
  <desc id="desc">Diagram showing Mirrage as a physical smart mirror with mirror glass, display, mini PC or Raspberry Pi, microphone, speakers, Docker production stack, frontend kiosk mode, FastAPI backend, wake engine, local memory, Home Assistant, optional AI server, and local network.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6ee7ff" />
    </marker>
    <style>
      .bg { fill: #030507; }
      .glass { fill: #101923; stroke: #b9f4ff; stroke-width: 2; rx: 18; }
      .core { fill: #111821; stroke: #6ee7ff; stroke-width: 2; rx: 16; }
      .service { fill: #0b1015; stroke: #263746; stroke-width: 2; rx: 16; }
      .safe { fill: #0d1719; stroke: #7cf7c4; stroke-width: 2; rx: 16; }
      .warn { fill: #17120a; stroke: #f7c66d; stroke-width: 2; rx: 16; }
      .data { fill: #101018; stroke: #b9a7ff; stroke-width: 2; rx: 16; }
      .label { fill: #f5f7fb; font: 700 21px Arial, sans-serif; }
      .small { fill: #9eb7ca; font: 500 14px Arial, sans-serif; }
      .tag { fill: #6ee7ff; font: 700 14px Arial, sans-serif; letter-spacing: 1px; }
      .line { stroke: #6ee7ff; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .green { stroke: #7cf7c4; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .gold { stroke: #f7c66d; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .muted { stroke: #344554; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1240" height="820" />

  <text x="60" y="52" class="tag">MIRRAGE</text>
  <text x="60" y="88" class="label">Physical Mirror Architecture</text>
  <text x="60" y="116" class="small">The mirror is the home appliance. Heavy AI and smart home services can stay elsewhere on the local network.</text>

  <rect x="55" y="155" width="300" height="170" class="glass" />
  <text x="205" y="190" text-anchor="middle" class="label">Physical Mirror</text>
  <text x="205" y="218" text-anchor="middle" class="small">two-way mirror material</text>
  <text x="205" y="242" text-anchor="middle" class="small">27 inch display target</text>
  <text x="205" y="266" text-anchor="middle" class="small">frame, ventilation, service back</text>
  <text x="205" y="290" text-anchor="middle" class="small">power, cable routing, wall mount</text>

  <rect x="435" y="145" width="230" height="90" class="core" />
  <text x="550" y="180" text-anchor="middle" class="label">Mini PC / Pi</text>
  <text x="550" y="206" text-anchor="middle" class="small">Linux host inside or behind mirror</text>

  <rect x="735" y="145" width="210" height="90" class="service" />
  <text x="840" y="180" text-anchor="middle" class="label">Docker Stack</text>
  <text x="840" y="206" text-anchor="middle" class="small">production Compose + systemd</text>

  <rect x="1010" y="145" width="170" height="90" class="service" />
  <text x="1095" y="180" text-anchor="middle" class="label">Kiosk UI</text>
  <text x="1095" y="206" text-anchor="middle" class="small">Mirror Mode frontend</text>

  <path d="M 355 240 L 435 190" class="line" />
  <path d="M 665 190 L 735 190" class="line" />
  <path d="M 945 190 L 1010 190" class="line" />

  <rect x="55" y="390" width="210" height="86" class="safe" />
  <text x="160" y="423" text-anchor="middle" class="label">Microphone</text>
  <text x="160" y="449" text-anchor="middle" class="small">USB conference mic or array</text>

  <rect x="300" y="390" width="190" height="86" class="safe" />
  <text x="395" y="423" text-anchor="middle" class="label">Speakers</text>
  <text x="395" y="449" text-anchor="middle" class="small">wired, serviceable</text>

  <rect x="535" y="360" width="220" height="116" class="core" />
  <text x="645" y="393" text-anchor="middle" class="label">FastAPI Backend</text>
  <text x="645" y="419" text-anchor="middle" class="small">API, health, integrations</text>
  <text x="645" y="443" text-anchor="middle" class="small">logs, backups, local memory</text>

  <rect x="805" y="360" width="175" height="116" class="safe" />
  <text x="892" y="393" text-anchor="middle" class="label">Wake Engine</text>
  <text x="892" y="419" text-anchor="middle" class="small">local OpenWakeWord</text>
  <text x="892" y="443" text-anchor="middle" class="small">no pre-wake cloud audio</text>

  <rect x="1020" y="360" width="160" height="116" class="service" />
  <text x="1100" y="393" text-anchor="middle" class="label">Voice Flow</text>
  <text x="1100" y="419" text-anchor="middle" class="small">browser STT/TTS today</text>
  <text x="1100" y="443" text-anchor="middle" class="small">backend STT later</text>

  <path d="M 160 390 L 805 418" class="green" />
  <path d="M 395 390 L 1020 418" class="green" />
  <path d="M 735 235 L 645 360" class="line" />
  <path d="M 755 418 L 805 418" class="green" />
  <path d="M 980 418 L 1020 418" class="line" />

  <rect x="55" y="590" width="180" height="86" class="data" />
  <text x="145" y="623" text-anchor="middle" class="label">SQLite Data</text>
  <text x="145" y="649" text-anchor="middle" class="small">memory + backups</text>

  <rect x="275" y="590" width="180" height="86" class="service" />
  <text x="365" y="623" text-anchor="middle" class="label">Weather</text>
  <text x="365" y="649" text-anchor="middle" class="small">backend provider</text>

  <rect x="495" y="590" width="180" height="86" class="service" />
  <text x="585" y="623" text-anchor="middle" class="label">Calendar</text>
  <text x="585" y="649" text-anchor="middle" class="small">Google OAuth</text>

  <rect x="715" y="590" width="180" height="86" class="service" />
  <text x="805" y="623" text-anchor="middle" class="label">Spotify</text>
  <text x="805" y="649" text-anchor="middle" class="small">playback API</text>

  <rect x="935" y="590" width="245" height="86" class="safe" />
  <text x="1057" y="623" text-anchor="middle" class="label">Home Assistant</text>
  <text x="1057" y="649" text-anchor="middle" class="small">local network, safe domains</text>

  <path d="M 645 476 L 145 590" class="muted" />
  <path d="M 645 476 L 365 590" class="muted" />
  <path d="M 645 476 L 585 590" class="muted" />
  <path d="M 645 476 L 805 590" class="muted" />
  <path d="M 645 476 L 1057 590" class="green" />

  <rect x="235" y="720" width="250" height="70" class="warn" />
  <text x="360" y="748" text-anchor="middle" class="label">Optional AI Server</text>
  <text x="360" y="771" text-anchor="middle" class="small">future heavy local LLMs, vision, agents</text>

  <rect x="755" y="720" width="250" height="70" class="warn" />
  <text x="880" y="748" text-anchor="middle" class="label">Local Network</text>
  <text x="880" y="771" text-anchor="middle" class="small">Ethernet preferred, Wi-Fi acceptable</text>

  <path d="M 645 476 L 360 720" class="gold" />
  <path d="M 645 476 L 880 720" class="gold" />
</svg>
