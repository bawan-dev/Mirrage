<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-labelledby="title desc">
  <title id="title">Mirrage architecture with smart home safety boundary</title>
  <desc id="desc">Mirrage system diagram showing the frontend, FastAPI backend, AI runtime, local memory, presence, integrations, smart home layer, Home Assistant provider, safe device discovery and control APIs, sensors, blocked high-risk actions, health, logs, and deployment.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6ee7ff" />
    </marker>
    <style>
      .bg { fill: #030507; }
      .core { fill: #101923; stroke: #6ee7ff; stroke-width: 2; rx: 16; }
      .service { fill: #0b1015; stroke: #22313d; stroke-width: 2; rx: 16; }
      .safe { fill: #0d1719; stroke: #7cf7c4; stroke-width: 2; rx: 16; }
      .warn { fill: #17120a; stroke: #f7c66d; stroke-width: 2; rx: 16; }
      .data { fill: #101018; stroke: #b9a7ff; stroke-width: 2; rx: 16; }
      .label { fill: #f5f7fb; font: 700 22px Arial, sans-serif; }
      .small { fill: #9eb7ca; font: 500 14px Arial, sans-serif; }
      .tag { fill: #6ee7ff; font: 700 14px Arial, sans-serif; letter-spacing: 1px; }
      .line { stroke: #6ee7ff; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .green { stroke: #7cf7c4; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .gold { stroke: #f7c66d; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .muted { stroke: #344554; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #f7c66d; stroke-width: 2; stroke-dasharray: 7 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1240" height="820" />

  <text x="70" y="54" class="tag">MIRRAGE</text>
  <text x="70" y="92" class="label">System Architecture</text>
  <text x="70" y="120" class="small">Backend-owned service boundaries for AI, context, voice, media, calendar, weather, smart home, health, logs, and deployment.</text>

  <rect x="70" y="170" width="235" height="86" class="core" />
  <text x="187" y="203" text-anchor="middle" class="label">Mirror UI</text>
  <text x="187" y="229" text-anchor="middle" class="small">React, focus views, voice UI</text>

  <rect x="390" y="160" width="250" height="106" class="core" />
  <text x="515" y="195" text-anchor="middle" class="label">FastAPI Backend</text>
  <text x="515" y="221" text-anchor="middle" class="small">service boundaries and routes</text>
  <text x="515" y="243" text-anchor="middle" class="small">no provider secrets in frontend</text>

  <path d="M 305 213 L 390 213" class="line" />

  <rect x="735" y="145" width="210" height="82" class="service" />
  <text x="840" y="177" text-anchor="middle" class="label">AI Runtime</text>
  <text x="840" y="203" text-anchor="middle" class="small">provider routing, fallback</text>

  <rect x="980" y="145" width="190" height="82" class="data" />
  <text x="1075" y="177" text-anchor="middle" class="label">Memory</text>
  <text x="1075" y="203" text-anchor="middle" class="small">local SQLite context</text>

  <rect x="735" y="260" width="210" height="82" class="service" />
  <text x="840" y="292" text-anchor="middle" class="label">Context</text>
  <text x="840" y="318" text-anchor="middle" class="small">daily briefing, proactive</text>

  <rect x="980" y="260" width="190" height="82" class="service" />
  <text x="1075" y="292" text-anchor="middle" class="label">Presence</text>
  <text x="1075" y="318" text-anchor="middle" class="small">wake, voice lifecycle</text>

  <path d="M 640 203 L 735 186" class="muted" />
  <path d="M 640 213 L 980 186" class="muted" />
  <path d="M 640 225 L 735 301" class="muted" />
  <path d="M 640 235 L 980 301" class="muted" />

  <rect x="70" y="365" width="220" height="82" class="service" />
  <text x="180" y="397" text-anchor="middle" class="label">Weather</text>
  <text x="180" y="423" text-anchor="middle" class="small">Open-Meteo via backend</text>

  <rect x="330" y="365" width="220" height="82" class="service" />
  <text x="440" y="397" text-anchor="middle" class="label">Calendar</text>
  <text x="440" y="423" text-anchor="middle" class="small">Google read-only events</text>

  <rect x="590" y="365" width="220" height="82" class="service" />
  <text x="700" y="397" text-anchor="middle" class="label">Spotify</text>
  <text x="700" y="423" text-anchor="middle" class="small">OAuth, playback controls</text>

  <rect x="850" y="365" width="320" height="82" class="safe" />
  <text x="1010" y="397" text-anchor="middle" class="label">Smart Home Layer</text>
  <text x="1010" y="423" text-anchor="middle" class="small">discovery, safety, normalized entities</text>

  <path d="M 515 266 L 180 365" class="muted" />
  <path d="M 515 266 L 440 365" class="muted" />
  <path d="M 550 266 L 700 365" class="muted" />
  <path d="M 600 266 L 1010 365" class="green" />

  <rect x="70" y="530" width="235" height="82" class="safe" />
  <text x="187" y="562" text-anchor="middle" class="label">Control API</text>
  <text x="187" y="588" text-anchor="middle" class="small">lights, switches, scenes</text>

  <rect x="350" y="530" width="235" height="82" class="safe" />
  <text x="467" y="562" text-anchor="middle" class="label">Sensors</text>
  <text x="467" y="588" text-anchor="middle" class="small">read-only state</text>

  <rect x="630" y="530" width="235" height="82" class="warn" />
  <text x="747" y="562" text-anchor="middle" class="label">Blocked</text>
  <text x="747" y="588" text-anchor="middle" class="small">locks, alarms, cameras, garage</text>

  <rect x="920" y="520" width="250" height="102" class="safe" />
  <text x="1045" y="553" text-anchor="middle" class="label">Home Assistant</text>
  <text x="1045" y="579" text-anchor="middle" class="small">local provider API</text>
  <text x="1045" y="601" text-anchor="middle" class="small">token stays backend-only</text>

  <path d="M 980 447 L 187 530" class="green" />
  <path d="M 1010 447 L 467 530" class="green" />
  <path d="M 1035 447 L 747 530" class="dash" />
  <path d="M 1050 447 L 1045 520" class="green" />

  <rect x="70" y="690" width="235" height="82" class="warn" />
  <text x="187" y="722" text-anchor="middle" class="label">Docker + systemd</text>
  <text x="187" y="748" text-anchor="middle" class="small">startup and restart policy</text>

  <rect x="390" y="690" width="235" height="82" class="safe" />
  <text x="507" y="722" text-anchor="middle" class="label">Health</text>
  <text x="507" y="748" text-anchor="middle" class="small">/api/health/full checks</text>

  <rect x="710" y="690" width="210" height="82" class="data" />
  <text x="815" y="722" text-anchor="middle" class="label">Data</text>
  <text x="815" y="748" text-anchor="middle" class="small">SQLite, backups</text>

  <rect x="980" y="690" width="190" height="82" class="warn" />
  <text x="1075" y="722" text-anchor="middle" class="label">Logs</text>
  <text x="1075" y="748" text-anchor="middle" class="small">structured, no secrets</text>

  <path d="M 515 266 L 187 690" class="gold" />
  <path d="M 515 266 L 507 690" class="green" />
  <path d="M 515 266 L 815 690" class="muted" />
  <path d="M 515 266 L 1075 690" class="gold" />
</svg>
