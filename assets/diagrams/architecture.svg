<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-labelledby="title desc">
  <title id="title">Mirrage architecture with local wake engine boundary</title>
  <desc id="desc">Mirrage system diagram showing a React mirror frontend, FastAPI backend, local microphone wake engine, local model file, cooldown and sensitivity boundary, Presence Engine, Server-Sent Events, browser voice pipeline, AI runtime, local memory, context, calendar, Spotify, smart home, health, logs, and Docker deployment.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6ee7ff" />
    </marker>
    <style>
      .bg { fill: #030507; }
      .core { fill: #101923; stroke: #6ee7ff; stroke-width: 2; rx: 16; }
      .service { fill: #0b1015; stroke: #22313d; stroke-width: 2; rx: 16; }
      .safe { fill: #0d1719; stroke: #7cf7c4; stroke-width: 2; rx: 16; }
      .warn { fill: #17120a; stroke: #f7c66d; stroke-width: 2; rx: 16; }
      .data { fill: #101018; stroke: #b9a7ff; stroke-width: 2; rx: 16; }
      .label { fill: #f5f7fb; font: 700 21px Arial, sans-serif; }
      .small { fill: #9eb7ca; font: 500 14px Arial, sans-serif; }
      .tag { fill: #6ee7ff; font: 700 14px Arial, sans-serif; letter-spacing: 1px; }
      .line { stroke: #6ee7ff; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .green { stroke: #7cf7c4; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .gold { stroke: #f7c66d; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .muted { stroke: #344554; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #f7c66d; stroke-width: 2; stroke-dasharray: 7 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1240" height="820" />

  <text x="60" y="52" class="tag">MIRRAGE</text>
  <text x="60" y="88" class="label">System Architecture</text>
  <text x="60" y="116" class="small">Local wake detection happens before any assistant or cloud provider receives a request.</text>

  <rect x="55" y="165" width="220" height="82" class="core" />
  <text x="165" y="198" text-anchor="middle" class="label">Mirror UI</text>
  <text x="165" y="224" text-anchor="middle" class="small">React, mirror mode, focus views</text>

  <rect x="370" y="150" width="250" height="112" class="core" />
  <text x="495" y="186" text-anchor="middle" class="label">FastAPI Backend</text>
  <text x="495" y="214" text-anchor="middle" class="small">routes, services, boundaries</text>
  <text x="495" y="236" text-anchor="middle" class="small">secrets stay server-side</text>

  <path d="M 275 206 L 370 206" class="line" />

  <rect x="715" y="130" width="210" height="82" class="safe" />
  <text x="820" y="162" text-anchor="middle" class="label">Microphone</text>
  <text x="820" y="188" text-anchor="middle" class="small">local device input</text>

  <rect x="980" y="130" width="210" height="82" class="safe" />
  <text x="1085" y="162" text-anchor="middle" class="label">Wake Engine</text>
  <text x="1085" y="188" text-anchor="middle" class="small">OpenWakeWord boundary</text>

  <rect x="980" y="245" width="210" height="82" class="data" />
  <text x="1085" y="277" text-anchor="middle" class="label">Model File</text>
  <text x="1085" y="303" text-anchor="middle" class="small">models/wake, not in Git</text>

  <rect x="715" y="245" width="210" height="82" class="warn" />
  <text x="820" y="277" text-anchor="middle" class="label">Wake Guard</text>
  <text x="820" y="303" text-anchor="middle" class="small">sensitivity and cooldown</text>

  <path d="M 925 171 L 980 171" class="green" />
  <path d="M 1085 212 L 1085 245" class="green" />
  <path d="M 980 286 L 925 286" class="green" />
  <path d="M 715 286 L 620 224" class="green" />

  <rect x="55" y="345" width="220" height="82" class="service" />
  <text x="165" y="377" text-anchor="middle" class="label">Presence Engine</text>
  <text x="165" y="403" text-anchor="middle" class="small">idle, wake, listen, speak</text>

  <rect x="370" y="345" width="250" height="82" class="service" />
  <text x="495" y="377" text-anchor="middle" class="label">SSE Events</text>
  <text x="495" y="403" text-anchor="middle" class="small">frontend subscribes</text>

  <rect x="715" y="365" width="210" height="82" class="service" />
  <text x="820" y="397" text-anchor="middle" class="label">Voice Pipeline</text>
  <text x="820" y="423" text-anchor="middle" class="small">browser STT and TTS today</text>

  <rect x="980" y="365" width="210" height="82" class="service" />
  <text x="1085" y="397" text-anchor="middle" class="label">Assistant Route</text>
  <text x="1085" y="423" text-anchor="middle" class="small">deterministic handlers first</text>

  <path d="M 495 262 L 165 345" class="green" />
  <path d="M 275 386 L 370 386" class="line" />
  <path d="M 620 386 L 715 406" class="line" />
  <path d="M 925 406 L 980 406" class="line" />

  <rect x="55" y="520" width="210" height="82" class="service" />
  <text x="160" y="552" text-anchor="middle" class="label">AI Runtime</text>
  <text x="160" y="578" text-anchor="middle" class="small">stub, Ollama, OpenAI</text>

  <rect x="310" y="520" width="210" height="82" class="data" />
  <text x="415" y="552" text-anchor="middle" class="label">Memory</text>
  <text x="415" y="578" text-anchor="middle" class="small">local SQLite</text>

  <rect x="565" y="520" width="210" height="82" class="service" />
  <text x="670" y="552" text-anchor="middle" class="label">Context</text>
  <text x="670" y="578" text-anchor="middle" class="small">daily briefing</text>

  <rect x="820" y="520" width="170" height="82" class="service" />
  <text x="905" y="552" text-anchor="middle" class="label">Calendar</text>
  <text x="905" y="578" text-anchor="middle" class="small">Google read-only</text>

  <rect x="1020" y="520" width="170" height="82" class="service" />
  <text x="1105" y="552" text-anchor="middle" class="label">Spotify</text>
  <text x="1105" y="578" text-anchor="middle" class="small">OAuth, playback</text>

  <path d="M 1085 447 L 160 520" class="muted" />
  <path d="M 1085 447 L 415 520" class="muted" />
  <path d="M 1085 447 L 670 520" class="muted" />
  <path d="M 1085 447 L 905 520" class="muted" />
  <path d="M 1085 447 L 1105 520" class="muted" />

  <rect x="55" y="690" width="210" height="82" class="safe" />
  <text x="160" y="722" text-anchor="middle" class="label">Smart Home</text>
  <text x="160" y="748" text-anchor="middle" class="small">safe Home Assistant layer</text>

  <rect x="310" y="690" width="210" height="82" class="safe" />
  <text x="415" y="722" text-anchor="middle" class="label">Health</text>
  <text x="415" y="748" text-anchor="middle" class="small">wake engine included</text>

  <rect x="565" y="690" width="210" height="82" class="data" />
  <text x="670" y="722" text-anchor="middle" class="label">Data</text>
  <text x="670" y="748" text-anchor="middle" class="small">SQLite, backups</text>

  <rect x="820" y="690" width="170" height="82" class="warn" />
  <text x="905" y="722" text-anchor="middle" class="label">Logs</text>
  <text x="905" y="748" text-anchor="middle" class="small">no raw audio</text>

  <rect x="1020" y="690" width="170" height="82" class="warn" />
  <text x="1105" y="722" text-anchor="middle" class="label">Docker</text>
  <text x="1105" y="748" text-anchor="middle" class="small">audio setup is host-specific</text>

  <path d="M 495 262 L 160 690" class="muted" />
  <path d="M 495 262 L 415 690" class="green" />
  <path d="M 495 262 L 670 690" class="muted" />
  <path d="M 495 262 L 905 690" class="gold" />
  <path d="M 495 262 L 1105 690" class="gold" />
</svg>
