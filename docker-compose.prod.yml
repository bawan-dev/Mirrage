name: mirrage-prod

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: mirrage-backend:${MIRRAGE_VERSION:-local}
    container_name: mirrage-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MIRRAGE_APP_ENV: production
      MIRRAGE_LOG_JSON: "true"
      MIRRAGE_LOG_FILE: /app/logs/backend.log
      MIRRAGE_MEMORY_DATABASE_PATH: /app/data/mirrage-memory.sqlite3
      MIRRAGE_BACKUP_DIRECTORY: /app/backups
      MIRRAGE_SMART_HOME_ENABLED: ${MIRRAGE_SMART_HOME_ENABLED:-false}
      MIRRAGE_SMART_HOME_TIMEOUT_SECONDS: ${MIRRAGE_SMART_HOME_TIMEOUT_SECONDS:-5}
      MIRRAGE_HOME_ASSISTANT_ENABLED: ${MIRRAGE_HOME_ASSISTANT_ENABLED:-false}
      MIRRAGE_HOME_ASSISTANT_BASE_URL: ${MIRRAGE_HOME_ASSISTANT_BASE_URL:-http://homeassistant.local:8123}
      MIRRAGE_HOME_ASSISTANT_TOKEN: ${MIRRAGE_HOME_ASSISTANT_TOKEN:-}
      MIRRAGE_WAKE_ENGINE_ENABLED: ${MIRRAGE_WAKE_ENGINE_ENABLED:-false}
      MIRRAGE_WAKE_ENGINE_PROVIDER: ${MIRRAGE_WAKE_ENGINE_PROVIDER:-openwakeword}
      MIRRAGE_WAKE_ENGINE_MODEL_PATH: ${MIRRAGE_WAKE_ENGINE_MODEL_PATH:-}
      MIRRAGE_WAKE_ENGINE_PHRASE: ${MIRRAGE_WAKE_ENGINE_PHRASE:-Hey Mirrage}
      MIRRAGE_WAKE_ENGINE_SENSITIVITY: ${MIRRAGE_WAKE_ENGINE_SENSITIVITY:-0.5}
      MIRRAGE_WAKE_ENGINE_MICROPHONE: ${MIRRAGE_WAKE_ENGINE_MICROPHONE:-}
      MIRRAGE_WAKE_ENGINE_SAMPLE_RATE: ${MIRRAGE_WAKE_ENGINE_SAMPLE_RATE:-16000}
      MIRRAGE_WAKE_ENGINE_FRAME_MS: ${MIRRAGE_WAKE_ENGINE_FRAME_MS:-80}
      MIRRAGE_WAKE_ENGINE_COOLDOWN_SECONDS: ${MIRRAGE_WAKE_ENGINE_COOLDOWN_SECONDS:-3}
    ports:
      - "${MIRRAGE_API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
        VITE_MIRROR_MODE: ${VITE_MIRROR_MODE:-true}
        VITE_MIRROR_DIM_TIMEOUT_SECONDS: ${VITE_MIRROR_DIM_TIMEOUT_SECONDS:-60}
        VITE_MIRROR_SLEEP_TIMEOUT_SECONDS: ${VITE_MIRROR_SLEEP_TIMEOUT_SECONDS:-120}
        VITE_MIRROR_STARTUP_SECONDS: ${VITE_MIRROR_STARTUP_SECONDS:-3}
        VITE_MIRROR_BURN_IN_SHIFT_SECONDS: ${VITE_MIRROR_BURN_IN_SHIFT_SECONDS:-45}
    image: mirrage-frontend:${MIRRAGE_VERSION:-local}
    container_name: mirrage-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${MIRRAGE_FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s
