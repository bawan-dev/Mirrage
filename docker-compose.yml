name: mirrage

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mirrage-backend
    environment:
      MIRRAGE_AI_PROVIDER: ${MIRRAGE_AI_PROVIDER:-stub}
      MIRRAGE_AI_MODEL: ${MIRRAGE_AI_MODEL:-}
      MIRRAGE_AI_BASE_URL: ${MIRRAGE_AI_BASE_URL:-}
      MIRRAGE_AI_API_KEY: ${MIRRAGE_AI_API_KEY:-}
      MIRRAGE_AI_RUNTIME_MODE: ${MIRRAGE_AI_RUNTIME_MODE:-standard}
      MIRRAGE_AI_LOCAL_FIRST: ${MIRRAGE_AI_LOCAL_FIRST:-false}
      MIRRAGE_AI_LOCAL_ONLY: ${MIRRAGE_AI_LOCAL_ONLY:-false}
      MIRRAGE_AI_FALLBACK_PROVIDER: ${MIRRAGE_AI_FALLBACK_PROVIDER:-stub}
      MIRRAGE_AI_STREAMING_ENABLED: ${MIRRAGE_AI_STREAMING_ENABLED:-true}
      MIRRAGE_AI_PRIVACY_MODE: ${MIRRAGE_AI_PRIVACY_MODE:-limited_cloud_context}
      MIRRAGE_AI_DEFAULT_TASK_MODEL: ${MIRRAGE_AI_DEFAULT_TASK_MODEL:-}
      MIRRAGE_AI_SUMMARY_MODEL: ${MIRRAGE_AI_SUMMARY_MODEL:-}
      MIRRAGE_AI_PLANNING_MODEL: ${MIRRAGE_AI_PLANNING_MODEL:-}
      MIRRAGE_ALLOWED_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      MIRRAGE_FRONTEND_URL: http://127.0.0.1:5173
      MIRRAGE_SPOTIFY_CLIENT_ID: ${MIRRAGE_SPOTIFY_CLIENT_ID:-}
      MIRRAGE_SPOTIFY_CLIENT_SECRET: ${MIRRAGE_SPOTIFY_CLIENT_SECRET:-}
      MIRRAGE_SPOTIFY_REDIRECT_URI: ${MIRRAGE_SPOTIFY_REDIRECT_URI:-http://127.0.0.1:8000/api/integrations/spotify/callback}
      MIRRAGE_GOOGLE_CALENDAR_CLIENT_ID: ${MIRRAGE_GOOGLE_CALENDAR_CLIENT_ID:-}
      MIRRAGE_GOOGLE_CALENDAR_CLIENT_SECRET: ${MIRRAGE_GOOGLE_CALENDAR_CLIENT_SECRET:-}
      MIRRAGE_GOOGLE_CALENDAR_REDIRECT_URI: ${MIRRAGE_GOOGLE_CALENDAR_REDIRECT_URI:-http://127.0.0.1:8000/api/integrations/calendar/callback}
      MIRRAGE_GOOGLE_CALENDAR_ID: ${MIRRAGE_GOOGLE_CALENDAR_ID:-primary}
      MIRRAGE_GOOGLE_CALENDAR_TIME_ZONE: ${MIRRAGE_GOOGLE_CALENDAR_TIME_ZONE:-Europe/London}
      MIRRAGE_MEMORY_DATABASE_PATH: ${MIRRAGE_MEMORY_DATABASE_PATH:-data/mirrage-memory.sqlite3}
      MIRRAGE_BACKUP_DIRECTORY: ${MIRRAGE_BACKUP_DIRECTORY:-backups}
      MIRRAGE_LOG_LEVEL: ${MIRRAGE_LOG_LEVEL:-INFO}
      MIRRAGE_LOG_JSON: ${MIRRAGE_LOG_JSON:-true}
      MIRRAGE_SMART_HOME_ENABLED: ${MIRRAGE_SMART_HOME_ENABLED:-false}
      MIRRAGE_SMART_HOME_TIMEOUT_SECONDS: ${MIRRAGE_SMART_HOME_TIMEOUT_SECONDS:-5}
      MIRRAGE_HOME_ASSISTANT_ENABLED: ${MIRRAGE_HOME_ASSISTANT_ENABLED:-false}
      MIRRAGE_HOME_ASSISTANT_BASE_URL: ${MIRRAGE_HOME_ASSISTANT_BASE_URL:-http://homeassistant.local:8123}
      MIRRAGE_HOME_ASSISTANT_TOKEN: ${MIRRAGE_HOME_ASSISTANT_TOKEN:-}
      MIRRAGE_WAKE_ENGINE_ENABLED: ${MIRRAGE_WAKE_ENGINE_ENABLED:-false}
      MIRRAGE_WAKE_ENGINE_PROVIDER: ${MIRRAGE_WAKE_ENGINE_PROVIDER:-openwakeword}
      MIRRAGE_WAKE_ENGINE_MODEL_PATH: ${MIRRAGE_WAKE_ENGINE_MODEL_PATH:-}
      MIRRAGE_WAKE_ENGINE_PHRASE: ${MIRRAGE_WAKE_ENGINE_PHRASE:-Hey Mirrage}
      MIRRAGE_WAKE_ENGINE_SENSITIVITY: ${MIRRAGE_WAKE_ENGINE_SENSITIVITY:-0.5}
      MIRRAGE_WAKE_ENGINE_MICROPHONE: ${MIRRAGE_WAKE_ENGINE_MICROPHONE:-}
      MIRRAGE_WAKE_ENGINE_SAMPLE_RATE: ${MIRRAGE_WAKE_ENGINE_SAMPLE_RATE:-16000}
      MIRRAGE_WAKE_ENGINE_FRAME_MS: ${MIRRAGE_WAKE_ENGINE_FRAME_MS:-80}
      MIRRAGE_WAKE_ENGINE_COOLDOWN_SECONDS: ${MIRRAGE_WAKE_ENGINE_COOLDOWN_SECONDS:-3}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./logs:/app/logs

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: mirrage-frontend
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000
      VITE_MIRRAGE_DEMO_MODE: ${VITE_MIRRAGE_DEMO_MODE:-false}
      VITE_MIRROR_MODE: ${VITE_MIRROR_MODE:-false}
      VITE_MIRROR_DIM_TIMEOUT_SECONDS: ${VITE_MIRROR_DIM_TIMEOUT_SECONDS:-60}
      VITE_MIRROR_SLEEP_TIMEOUT_SECONDS: ${VITE_MIRROR_SLEEP_TIMEOUT_SECONDS:-120}
      VITE_MIRROR_STARTUP_SECONDS: ${VITE_MIRROR_STARTUP_SECONDS:-3}
      VITE_MIRROR_BURN_IN_SHIFT_SECONDS: ${VITE_MIRROR_BURN_IN_SHIFT_SECONDS:-45}
    ports:
      - "5173:5173"
    depends_on:
      - backend
